# Shiny Server configuration for Interaktywne Wyklady
# All apps served from /srv/shiny-server/ with server-side R computation

run_as shiny;

# Define server listening on port 3838
server {
  listen 3838;

  # Landing page (portal with links to all apps)
  location / {
    site_dir /srv/shiny-server/portal;
    log_dir /var/log/shiny-server/portal;
    directory_index on;
  }

  # --- Podstawy statystyki opisowej ---
  location /losowanie-spoznienia {
    app_dir /srv/shiny-server/losowanie-spoznienia;
    log_dir /var/log/shiny-server/losowanie-spoznienia;
  }

  location /histogram-builder {
    app_dir /srv/shiny-server/histogram-builder;
    log_dir /var/log/shiny-server/histogram-builder;
  }

  location /box-plot-builder {
    app_dir /srv/shiny-server/box-plot-builder;
    log_dir /var/log/shiny-server/box-plot-builder;
  }

  location /srednia-vs-mediana {
    app_dir /srv/shiny-server/srednia-vs-mediana;
    log_dir /var/log/shiny-server/srednia-vs-mediana;
  }

  location /odchylenie-standardowe {
    app_dir /srv/shiny-server/odchylenie-standardowe;
    log_dir /var/log/shiny-server/odchylenie-standardowe;
  }

  location /moments-explorer {
    app_dir /srv/shiny-server/moments-explorer;
    log_dir /var/log/shiny-server/moments-explorer;
  }

  location /gra-estymacja {
    app_dir /srv/shiny-server/gra-estymacja;
    log_dir /var/log/shiny-server/gra-estymacja;
  }

  # --- Rozkłady prawdopodobieństwa ---
  location /distribution-explorer {
    app_dir /srv/shiny-server/distribution-explorer;
    log_dir /var/log/shiny-server/distribution-explorer;
  }

  location /sampling-explorer {
    app_dir /srv/shiny-server/sampling-explorer;
    log_dir /var/log/shiny-server/sampling-explorer;
  }

  # --- Testowanie hipotez ---
  location /zalozenia-testow {
    app_dir /srv/shiny-server/zalozenia-testow;
    log_dir /var/log/shiny-server/zalozenia-testow;
  }

  location /test-t-builder {
    app_dir /srv/shiny-server/test-t-builder;
    log_dir /var/log/shiny-server/test-t-builder;
  }

  location /chi-kwadrat-builder {
    app_dir /srv/shiny-server/chi-kwadrat-builder;
    log_dir /var/log/shiny-server/chi-kwadrat-builder;
  }

  location /korelacja-builder {
    app_dir /srv/shiny-server/korelacja-builder;
    log_dir /var/log/shiny-server/korelacja-builder;
  }

  # --- Regresja i modelowanie ---
  location /regresja-interakcja {
    app_dir /srv/shiny-server/regresja-interakcja;
    log_dir /var/log/shiny-server/regresja-interakcja;
  }
}
